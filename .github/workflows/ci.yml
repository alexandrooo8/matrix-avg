name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v3

      - name: Установка зависимостей
        run: sudo apt update && sudo apt install -y g++ make

      - name: Сборка программы
        run: bash ./cicd/build.sh

      - name: Сохранение артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: build/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v3

      - name: Загрузка артефакта сборки
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: build/

      - name: Выдача прав на исполнение
        run: chmod +x build/matrix_avg

      - name: Запуск тестов
        run: bash ./cicd/test.sh

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v3

      - name: Установка зависимостей
        run: sudo apt update && sudo apt install -y g++ make dpkg-dev

      - name: Загрузка артефакта сборки
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: build/

      - name: Выдача прав на исполнение
        run: chmod +x build/matrix_avg

      - name: Сборка deb-пакета
        run: bash ./cicd/package.sh

      - name: Сохранение deb-пакета
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "*.deb"
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v3

      - name: Загрузка deb-артефакта
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: .

      - name: Логин в DockerHub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Сборка Docker-образа
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/matrix-avg:latest .

      - name: Запуск Docker-образа
        run: docker run ${{ secrets.DOCKER_USERNAME }}/matrix-avg:latest

      - name: Публикация образа на DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/matrix-avg:latest
